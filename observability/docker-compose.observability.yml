# observability/docker-compose.observability.yml
# Stack de observabilidad para Memexicanisimos OS v4.0
# Uso: docker compose -f docker-compose.yml -f observability/docker-compose.observability.yml up -d

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: memex-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=1GB"
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: memex-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: memex2024
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/memex.json
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  memex-exporter:
    build: ./observability
    container_name: memex-exporter
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ../memex_workspace:/data/workspace:ro
    environment:
      MEMEX_DB_PATH: /data/memex_memory.db
      WORKSPACE_PATH: /data/workspace
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  prometheus-data:
  grafana-data:
