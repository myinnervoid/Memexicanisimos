# Prometheus Configuration for Memexicanisimos OS
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "memex-exporter"
    static_configs:
      - targets: ["memex-exporter:9091"]
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
